<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Game Club v2 — Boshqaruv paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0A0D12; --bg-1:#10141C; --bg-2:#151B26; --bg-3:#1B2230;
  --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.14);
  --txt-0:#EDEFF3; --txt-1:#A6AEC0; --txt-2:#6C7488;
  --teal:#19D3B5; --teal-dim:#0F8A78; --violet:#8B7CFF;
  --amber:#F2B341; --red:#F2555A; --green:#3ECF8E;
  --teal-bg:rgba(25,211,181,0.10); --violet-bg:rgba(139,124,255,0.10);
  --amber-bg:rgba(242,179,65,0.10); --red-bg:rgba(242,85,90,0.10); --green-bg:rgba(62,207,142,0.10);
  --radius-s:8px; --radius-m:12px; --radius-l:18px;
  --font-ui:'Sora',system-ui,-apple-system,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-0);color:var(--txt-0);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
#root{min-height:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* shell */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--bg-1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:800;font-size:18px}
.brand-dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--teal),var(--violet))}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--txt-1);font-weight:500;font-size:14px;background:none;border:none;width:100%;text-align:left;margin-bottom:2px}
.nav-item:hover{background:var(--bg-2);color:var(--txt-0)}
.nav-item.active{background:var(--teal-bg);color:var(--teal)}
.nav-badge{margin-left:auto;font-size:11px;background:var(--bg-3);border-radius:20px;padding:2px 8px}
.nav-badge.warn{background:var(--amber-bg);color:var(--amber)}
.nav-icon{display:flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;color:var(--txt-2)}
.nav-icon svg{width:18px;height:18px}
.nav-item.active .nav-icon{color:var(--teal)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04211C;flex-shrink:0}
.kpi{padding:16px 18px}
.kpi-label{font-size:11.5px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:700}
.kpi-sub{font-size:11.5px;margin-top:4px}
.card:hover{border-color:var(--line-strong)}
.main{flex:1;padding:24px 28px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.topbar h1{font-size:20px;margin:0;font-weight:700}
.spacer{flex:1}
.pill{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);color:var(--txt-1)}
.pill.live{color:var(--green);border-color:rgba(62,207,142,0.4);background:var(--green-bg)}
.pill.off{color:var(--amber);border-color:rgba(242,179,65,0.4);background:var(--amber-bg)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg-1);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg-2);color:var(--txt-0);font-weight:600;font-size:14px}
.btn:hover{background:var(--bg-3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#04211C}
.btn.primary:hover{background:#22e2c3}
.btn.danger{background:var(--red-bg);border-color:rgba(242,85,90,0.5);color:var(--red)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:0.45;cursor:not-allowed}

/* cards */
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px;transition:border-color .15s ease}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi-accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-label{font-size:12px;color:var(--txt-2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700}

/* rooms */
.rooms-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.room{position:relative;overflow:hidden}
.room-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.room-name{font-weight:700;font-size:16px}
.status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.status.free{background:var(--green-bg);color:var(--green)}
.status.busy{background:var(--red-bg);color:var(--red)}
.status.reserved{background:var(--amber-bg);color:var(--amber)}
.status.maintenance{background:var(--violet-bg);color:var(--violet)}
.room-overtime{animation:roomPulse 1.4s ease-in-out infinite; border-color:var(--red)!important;}
@keyframes roomPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,85,90,0);} 50%{box-shadow:0 0 0 4px rgba(242,85,90,0.28);}}
.room-time{font-size:26px;font-weight:700}
.room-price{font-size:13px;color:var(--txt-2);margin-top:2px}
.room-cost{font-size:18px;font-weight:700;color:var(--teal);margin-top:10px}
.room-actions{display:flex;gap:8px;margin-top:14px}
.room-actions .btn{flex:1;justify-content:center}
.room-progress{height:5px;border-radius:4px;background:var(--bg-3);margin-top:10px;overflow:hidden}
.room-progress-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .4s linear}
.room-progress-fill.over{background:var(--red)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--txt-2);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.low{color:var(--red);font-weight:700}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(4,6,10,0.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--bg-1);border:1px solid var(--line-strong);border-radius:var(--radius-l);padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:5px}
.input,select.input{width:100%;background:var(--bg-2);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;color:var(--txt-0);font-size:14px;outline:none}
.input:focus{border-color:var(--teal)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1;justify-content:center}
.err{background:var(--red-bg);color:var(--red);border:1px solid rgba(242,85,90,0.4);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(62,207,142,0.4);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}

/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px}
.auth-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:6px}
.auth-sub{color:var(--txt-2);font-size:13px;margin-bottom:20px}
.seg{display:flex;background:var(--bg-2);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:none;background:none;color:var(--txt-1);padding:8px;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--bg-3);color:var(--txt-0)}

/* pos */
.pos{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px 14px 84px}}
.mobile-nav{display:none}
.mobile-logout{display:none}
@media(max-width:900px){
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg-1);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mobile-nav button{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--txt-2);font-size:10.5px;padding:6px 4px;border-radius:10px}
  .mobile-nav button.active{color:var(--teal);background:var(--teal-bg)}
  .mobile-nav .nav-icon{width:19px;height:19px}
  .mobile-nav .nav-icon svg{width:19px;height:19px}
  .mobile-logout{display:inline-flex}
}
.pos-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.prod{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;cursor:pointer;text-align:left;color:var(--txt-0)}
.prod:hover{border-color:var(--teal)}
.prod .nm{font-weight:600;font-size:13px;margin-bottom:6px}
.prod .pr{color:var(--teal);font-weight:700}
.prod .st{font-size:11px;color:var(--txt-2);margin-top:4px}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-strong);background:var(--bg-2);color:var(--txt-0);font-weight:700}
.section-title{font-size:15px;font-weight:700;margin:0 0 12px}
.muted{color:var(--txt-2);font-size:13px}
.mt{margin-top:16px}
</style>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo} = React;

/* ================= SOZLASH ================= */
const SUPABASE_URL = "";      // Project URL
const SUPABASE_ANON_KEY = ""; // anon public key

function getCfg(){
  try{ const s = JSON.parse(localStorage.getItem("gc2_cfg")||"null"); if(s&&s.url&&s.key) return s; }catch(e){}
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL, key:SUPABASE_ANON_KEY};
  return null;
}
function setCfg(c){ try{ c?localStorage.setItem("gc2_cfg",JSON.stringify(c)):localStorage.removeItem("gc2_cfg"); }catch(e){} }

const fmt = n => (Number(n)||0).toLocaleString("uz-UZ");
const money = n => fmt(Math.round(Number(n)||0)) + " so'm";
// Summasiz (o'lchovli) seanslarda narx doim 500 so'mgacha yaxlitlanadi (kassa bilan mos kelishi uchun)
const ROUND_STEP = 500;
const roundMoney = n => Math.ceil((Number(n)||0)/ROUND_STEP)*ROUND_STEP;

/* ================= SUPABASE CONTEXT ================= */
let sb = null;

async function sbFetchAll(table, select="*"){
  const out = []; let from = 0;
  while(true){
    const {data, error} = await sb.from(table).select(select).range(from, from+999);
    if(error) throw error;
    out.push(...(data||[]));
    if(!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}

/* ================= AUTH ================= */
function AuthScreen({onReady}){
  const [cfg, setCfgState] = useState(getCfg());
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [name, setName] = useState("");
  const [url, setUrl] = useState(cfg?.url||"");
  const [key, setKey] = useState(cfg?.key||"");
  const [showSetup, setShowSetup] = useState(!cfg);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(()=>{ if(cfg){ sb = supabase.createClient(cfg.url, cfg.key);
    sb.auth.getSession().then(({data})=>{ if(data.session) onReady(data.session); });
  }},[]);

  async function submit(e){
    e.preventDefault(); setErr(""); setBusy(true);
    try{
      if(mode==="login"){
        const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
        if(error) throw error;
        onReady(data.session);
      }else{
        const {data, error} = await sb.auth.signUp({email, password:pass, options:{data:{full_name:name}}});
        if(error) throw error;
        if(!data.session) setErr("Ro'yxatdan o'tish yuborildi. Agar email tasdiqlash yoqilgan bo'lsa, pochtangizni tekshiring (Supabase Dashboard > Authentication > Settings > 'Confirm email' ni o'chirib qo'yishingiz mumkin).");
        else onReady(data.session);
      }
    }catch(e){ setErr(e.message); }
    setBusy(false);
  }

  function saveSetup(){
    if(!url || !key){ setErr("URL va kalitni to'ldiring"); return; }
    const c = {url:url.trim(), key:key.trim()};
    setCfg(c); setCfgState(c); setShowSetup(false); setErr("");
    window.location.reload();
  }

  return (
    <div className="auth-wrap">
      <div className="card auth-card">
        <div className="auth-logo"><span className="brand-dot"></span> Game Club <span className="pill">v2</span></div>
        <div className="auth-sub">Supabase Auth himoyasidagi boshqaruv paneli</div>
        {showSetup ? (
          <div>
            <h3 className="section-title">Supabase ulanish</h3>
            <div className="field"><label>Project URL</label><input className="input" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></div>
            <div className="field"><label>Anon public key</label><input className="input" value={key} onChange={e=>setKey(e.target.value)} placeholder="sb_publishable_..."/></div>
            {err && <div className="err">{err}</div>}
            <div className="modal-actions">
              <button className="btn primary" onClick={saveSetup}>Saqlash</button>
              {cfg && <button className="btn" onClick={()=>setShowSetup(false)}>Orqaga</button>}
            </div>
            <p className="muted mt">Kalit: Supabase Dashboard → Project Settings → API → anon/public. Eski <b>sb_anon_...</b> kalit ham ishlaydi.</p>
          </div>
        ) : (
          <form onSubmit={submit}>
            <div className="seg">
              <button type="button" className={mode==="login"?"on":""} onClick={()=>setMode("login")}>Kirish</button>
              <button type="button" className={mode==="signup"?"on":""} onClick={()=>setMode("signup")}>Ro'yxatdan o'tish</button>
            </div>
            {mode==="signup" && <div className="field"><label>Ism</label><input className="input" value={name} onChange={e=>setName(e.target.value)}/></div>}
            <div className="field"><label>Email</label><input className="input" type="email" required value={email} onChange={e=>setEmail(e.target.value)}/></div>
            <div className="field"><label>Parol</label><input className="input" type="password" required minLength={6} value={pass} onChange={e=>setPass(e.target.value)}/></div>
            {err && <div className="err">{err}</div>}
            <button className="btn primary" style={{width:"100%",justifyContent:"center"}} disabled={busy}>{busy?"...":(mode==="login"?"Kirish":"Ro'yxatdan o'tish")}</button>
            <p className="muted mt" style={{textAlign:"center"}}>
              <a style={{color:"var(--teal)",cursor:"pointer"}} onClick={()=>{setShowSetup(true);setErr("");}}>Supabase sozlamasi</a>
            </p>
          </form>
        )}
      </div>
    </div>
  );
}

/* ================= MODAL ================= */
function Modal({title, onClose, children, width}){
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" style={width?{maxWidth:width}:null} onClick={e=>e.stopPropagation()}>
        <h3>{title}</h3>
        {children}
      </div>
    </div>
  );
}

/* ================= ASOSIY ILLOVA ================= */
const NAV = [
  {id:"dashboard", label:"Boshqaruv"},
  {id:"rooms", label:"Xonalar"},
  {id:"pos", label:"Sotuv"},
  {id:"stock", label:"Ombor"},
  {id:"suppliers", label:"Ta'minotchilar"},
  {id:"clients", label:"Mijozlar"},
  {id:"debts", label:"Qarzlar"},
  {id:"cash", label:"Kassa"},

  {id:"staff", label:"Xodimlar", admin:true},
];
const NAV_ICONS = {

  rooms: <svg viewBox="0 0 20 20" fill="none"><path d="M3 8.5 10 3l7 5.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M4.5 7.5V16a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V7.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><rect x="8.2" y="11.5" width="3.6" height="5.5" stroke="currentColor" strokeWidth="1.5"/></svg>,
  pos: <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="10.5" rx="1.8" stroke="currentColor" strokeWidth="1.5"/><path d="M2.5 8.5h15" stroke="currentColor" strokeWidth="1.5"/><path d="M5.5 11.5h3M5.5 13.5h5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  stock: <svg viewBox="0 0 20 20" fill="none"><path d="M3 6.2 10 2.8l7 3.4-7 3.4-7-3.4Z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M3 6.2v7.6l7 3.4 7-3.4V6.2" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M10 9.6v7.6" stroke="currentColor" strokeWidth="1.5"/></svg>,
  clients: <svg viewBox="0 0 20 20" fill="none"><circle cx="7.2" cy="6.5" r="2.6" stroke="currentColor" strokeWidth="1.5"/><path d="M2.4 16c.5-3 2.4-4.6 4.8-4.6s4.3 1.6 4.8 4.6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><circle cx="14.2" cy="7.2" r="2.1" stroke="currentColor" strokeWidth="1.4"/><path d="M12.9 11.7c1.9-.4 3.6.7 4.1 3.4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  cash: <svg viewBox="0 0 20 20" fill="none"><rect x="2.3" y="5.5" width="15.4" height="9.5" rx="1.8" stroke="currentColor" strokeWidth="1.5"/><circle cx="10" cy="10.2" r="2.3" stroke="currentColor" strokeWidth="1.5"/><path d="M5 8v-.3c0-1 .8-1.8 1.8-1.8M15 12.5v.3c0 1-.8 1.8-1.8 1.8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,
  reports: <svg viewBox="0 0 20 20" fill="none"><path d="M4 16.5V9M9.3 16.5V4.5M14.6 16.5v-6.2" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/><path d="M2.5 16.5h15" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  staff: <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.3" r="3" stroke="currentColor" strokeWidth="1.5"/><path d="M3.5 17c.7-4 3-6 6.5-6s5.8 2 6.5 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  suppliers: <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="6.5" width="9.5" height="7" rx="1.3" stroke="currentColor" strokeWidth="1.5"/><path d="M11.5 9h3.2l2.3 2.5v2h-5.5" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><circle cx="6" cy="15.3" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="14.3" cy="15.3" r="1.5" stroke="currentColor" strokeWidth="1.4"/></svg>,
  debts: <svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5v15M6 5.8h5.2c1.5 0 2.5.8 2.5 2s-1 2-2.5 2H7.5c-1.5 0-2.5.8-2.5 2s1 2 2.5 2H14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
};

function App({session}){
  const [view, setView] = useState("dashboard");
  const [profile, setProfile] = useState(null);
  const [rooms, setRooms] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [products, setProducts] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [cash, setCash] = useState([]);
  const [sales, setSales] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [supplierTx, setSupplierTx] = useState([]);
  const [supplierPayments, setSupplierPayments] = useState([]);
  const [customerDebts, setCustomerDebts] = useState([]);
  const [profiles, setProfiles] = useState([]);
  const [live, setLive] = useState(false);
  const [toast, setToast] = useState("");
  const [modal, setModal] = useState(null); // {type, ...}
  const [now, setNow] = useState(Date.now());
  const chRef = useRef(null);

  // Admin va operator teng huquqqa ega (backend'da gc_is_admin ham ikkalasini qamraydi)
  const isAdmin = ["admin","operator"].includes(profile?.role);
  const isStaff = ["admin","operator","cashier"].includes(profile?.role);
  const canOperate = ["admin","operator"].includes(profile?.role);
  const canCash = ["admin","cashier"].includes(profile?.role);

  function notify(msg){ setToast(msg); setTimeout(()=>setToast(""), 3000); }

  async function refreshAll(){
    try{
      const [r, s, p, c, ct, sl, ex, sup, stx, spay, cd] = await Promise.all([
        sbFetchAll("rooms"),
        sb.from("sessions").select("*").eq("status","open"),
        sbFetchAll("products"),
        sbFetchAll("customers"),
        sb.from("cash_transactions").select("*").order("created_at",{ascending:false}).limit(500),
        sb.from("sales").select("*, sale_items(*)").order("created_at",{ascending:false}).limit(300),
        sbFetchAll("expenses"),
        sbFetchAll("suppliers"),
        sbFetchAll("supplier_transactions"),
        sbFetchAll("supplier_payments"),
        sbFetchAll("customer_debts"),
      ]);
      setRooms((r||[]).sort((a,b)=>a.sort_order-b.sort_order));
      setSessions(s.data||[]);
      setProducts(p||[]);
      setCustomers(c||[]);
      setCash(ct.data||[]);
      setSales(sl.data||[]);
      setExpenses(ex||[]);
      setSuppliers(sup||[]);
      setSupplierTx(stx||[]);
      setSupplierPayments(spay||[]);
      setCustomerDebts(cd||[]);
    }catch(e){ console.error(e); }
  }

  useEffect(()=>{
    (async ()=>{
      const {data} = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      setProfile(data);
      await refreshAll();
      if(chRef.current) sb.removeChannel(chRef.current);
      chRef.current = sb.channel("gc2")
        .on("postgres_changes",{event:"*",schema:"public",table:"rooms"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"sessions"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"products"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"customers"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"cash_transactions"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"sales"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"supplier_transactions"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"supplier_payments"}, refreshAll)
        .on("postgres_changes",{event:"*",schema:"public",table:"customer_debts"}, refreshAll)
        .subscribe((st)=>setLive(st==="SUBSCRIBED"));
      if(isAdminRef.current){ /* profiles loaded in StaffView */ }
    })();
    const t = setInterval(()=>setNow(Date.now()), 1000);
    return ()=>{ clearInterval(t); if(chRef.current) sb.removeChannel(chRef.current); };
  },[]);

  const isAdminRef = useRef(isAdmin);
  isAdminRef.current = isAdmin;

  const [salaryPayments, setSalaryPayments] = useState([]);
  async function loadProfiles(){
    const {data} = await sb.from("profiles").select("*").order("created_at");
    setProfiles(data||[]);
    const {data: sp} = await sb.from("salary_payments").select("*").order("created_at",{ascending:false});
    setSalaryPayments(sp||[]);
  }

  async function callRpc(name, params, okMsg){
    const {error} = await sb.rpc(name, params);
    if(error){ notify("Xato: " + error.message); return false; }
    if(okMsg) notify(okMsg);
    await refreshAll();
    return true;
  }

  async function importCashJson(file){
    try{
      const text = await file.text();
      const arr = JSON.parse(text);
      if(!Array.isArray(arr)) throw new Error("Fayl massiv (array) ko'rinishida bo'lishi kerak");
      let ok=0, skip=0;
      for(const e of arr){
        const noteVal = (e.description || e.note || "").toString().trim();
        const amountVal = Number(e.amount);
        const dirVal = e.direction==="out" ? "out" : "in";
        if(!(amountVal>0) || !noteVal){ skip++; continue; }
        const {error} = await sb.rpc("gc_add_cash_entry", {p_direction:dirVal, p_amount:amountVal, p_note:noteVal});
        if(error) skip++; else ok++;
      }
      notify(`Import: ${ok} ta qo'shildi${skip?`, ${skip} ta o'tkazib yuborildi`:""}`);
      await refreshAll();
    }catch(e){ notify("Import xatosi: " + e.message); }
  }

  const openSessionOf = (roomId)=> sessions.find(s=>s.room_id===roomId && s.status==="open");

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand"><span className="brand-dot"></span> Game Club</div>
        {NAV.filter(n=>!n.admin || isAdmin).map(n=>(
          <button key={n.id} className={"nav-item"+(view===n.id?" active":"")} onClick={()=>{setView(n.id); if(n.id==="staff") loadProfiles();}}>
            <span className="nav-icon">{NAV_ICONS[n.id]}</span>
            <span style={{flex:1, textAlign:"left"}}>{n.label}</span>
            {n.id==="rooms" && rooms.filter(r=>r.status==="busy").length>0 && <span className="nav-badge num">{rooms.filter(r=>r.status==="busy").length}</span>}
            {n.id==="stock" && products.filter(p=>Number(p.stock_qty)<=Number(p.min_stock)).length>0 && <span className="nav-badge num warn">{products.filter(p=>Number(p.stock_qty)<=Number(p.min_stock)).length}</span>}
          </button>
        ))}
        <div style={{flex:1}}></div>
        <div className="user-chip">
          <div className="user-avatar">{(profile?.full_name || session.user.email || "?").trim().charAt(0).toUpperCase()}</div>
          <div>
            <div style={{fontWeight:600}}>{profile?.full_name || session.user.email}</div>
            <div className="muted" style={{fontSize:11}}>{profile?.role||"..."}</div>
          </div>
        </div>
        <button className="btn small mt" style={{width:"100%",justifyContent:"center"}} onClick={async ()=>{ await sb.auth.signOut(); location.reload(); }}>Chiqish</button>
      </aside>

      <nav className="mobile-nav">
        {NAV.filter(n=>!n.admin || isAdmin).map(n=>(
          <button key={n.id} className={view===n.id?"active":""} onClick={()=>{setView(n.id); if(n.id==="staff") loadProfiles();}}>
            <span className="nav-icon">{NAV_ICONS[n.id]}</span>
            <span>{n.label}</span>
          </button>
        ))}
      </nav>

      <main className="main">
        <div className="topbar">
          <h1>{NAV.find(n=>n.id===view)?.label}</h1>
          <div className="spacer"></div>
          <span className={"pill "+(live?"live":"off")}>{live?"● Live":"offline"}</span>
          <button className="btn small mobile-logout" onClick={async ()=>{ await sb.auth.signOut(); location.reload(); }}>Chiqish</button>
        </div>
        {toast && <div className="ok" style={{position:"fixed",top:16,right:16,zIndex:99}}>{toast}</div>}

        {view==="dashboard" && (
          <DashboardView {...{rooms, sessions, products, cash, sales, expenses, now, onGoRooms:()=>setView("rooms"), onGoStock:()=>setView("stock")}} />
        )}

        {view==="rooms" && (
          <RoomsView {...{rooms, sessions, products, customers, now, canOperate, isAdmin, notify,
            onStart:(room)=>setModal({type:"start", room}),
            onEnd:(room)=>setModal({type:"end", room, session:openSessionOf(room.id)}),
            onAddRoom:()=>setModal({type:"addRoom"}),
            onEditRoom:(room)=>setModal({type:"editRoom", room}),
            onAddItem:(room, sess)=>setModal({type:"addItem", room, session:sess}),
          }}/>
        )}
        {view==="pos" && isStaff && (
          <PosView {...{products, customers, callRpc, notify}}/>
        )}
        {view==="stock" && (
          <StockView {...{products, isAdmin, onAdd:()=>setModal({type:"addProduct"}), onRestock:(p)=>setModal({type:"restock", product:p}), onEdit:(p)=>setModal({type:"editProduct", product:p}), onYukQabul:()=>setModal({type:"yukQabul"}),
            onDelete:(p)=>{ if(confirm(`"${p.name}" butunlay o'chirilsinmi? Bu amalni qaytarib bo'lmaydi.`)) callRpc("gc_delete_product",{p_product_id:p.id}, "Mahsulot o'chirildi"); } }}/>
        )}
        {view==="suppliers" && (
          <SuppliersView {...{suppliers, supplierTx, supplierPayments, isStaff,
            onAddSupplier:()=>setModal({type:"addSupplier"}),
            onAddTx:(s)=>setModal({type:"supplierTx", supplier:s}),
            onPay:(s)=>setModal({type:"supplierPay", supplier:s}),
            onYukQabul:()=>setModal({type:"yukQabul"}),
            onDelete:(s)=>{ if(confirm(`"${s.name}" butunlay o'chirilsinmi? Tarixi ham o'chadi.`)) callRpc("gc_delete_supplier",{p_supplier_id:s.id}, "Ta'minotchi o'chirildi"); },
          }}/>
        )}
        {view==="clients" && (
          <ClientsView {...{customers, isStaff, callRpc, onAdd:()=>setModal({type:"addCustomer"}), onTopup:(c)=>setModal({type:"topup", customer:c}), onDebt:(c)=>setModal({type:"customerDebt", customer:c})}}/>
        )}
        {view==="debts" && (
          <DebtsView {...{customers, customerDebts, suppliers, supplierTx, supplierPayments, isStaff,
            onPayCustomerDebt:(d)=>setModal({type:"customerDebtPay", debt:d}),
            onPaySupplier:(s)=>setModal({type:"supplierPay", supplier:s}),
          }}/>
        )}
        {view==="cash" && (
          <CashView {...{cash, expenses, isStaff, canCash, onExpense:()=>setModal({type:"expense"}),
            onManualEntry:(dir,amt,note)=>callRpc("gc_add_cash_entry",{p_direction:dir,p_amount:amt,p_note:note}, "Kassa yozuvi qo'shildi"),
            onImportJson:importCashJson,
          }}/>
        )}
        {view==="reports" && (
          <ReportsView {...{cash, sales, sessions, expenses, products, isAdmin,
            backupData:{rooms, products, customers, sales, cash, expenses, suppliers, supplierTx, supplierPayments, customerDebts},
            onClearTransactions:(resetStock)=>callRpc("gc_admin_clear_transactions",{p_reset_stock:!!resetStock}, resetStock?"Tranzaksiya + ombor tozalandi":"Tranzaksiya tarixi tozalandi"),
            onClearAll:()=>callRpc("gc_admin_clear_all",{}, "Barcha ma'lumot tozalandi — yangi ish boshlandi"),
            onRestoreSuppliers:async (data)=>{
              const {error} = await sb.rpc("gc_admin_restore_suppliers",{p_data:data});
              if(error){ notify("Xato: "+error.message); return false; }
              notify("Ta'minotchilar va qarzlar tiklandi");
              await refreshAll();
              return true;
            },
          }}/>
        )}
        {view==="staff" && isAdmin && (
          <StaffView {...{profiles, salaryPayments, callRpc,
            onSaveSalary:async (userId, agreed, startDate)=>{
              const {error} = await sb.from("profiles").update({agreed_salary:agreed, salary_start_date:startDate}).eq("id",userId);
              if(error) notify("Xato: "+error.message); else { notify("Saqlandi"); await loadProfiles(); }
            },
            onPay:async (userId, amount, note)=>{
              const ok = await callRpc("gc_pay_salary",{p_user_id:userId, p_amount:amount, p_note:note}, "To'lov qo'shildi");
              if(ok) await loadProfiles();
            },
          }}/>
        )}
      </main>

      {modal?.type==="start" && (
        <StartModal room={modal.room} customers={customers}
          onClose={()=>setModal(null)}
          onOk={async (customerId, tariff, amount, method)=>{
            const ok = await callRpc("gc_start_session",{p_room_id:modal.room.id, p_customer_id:customerId||null, p_tariff:tariff, p_amount:amount, p_method:method});
            if(ok) setModal(null);
          }}/>
      )}
      {modal?.type==="end" && (
        <EndModal room={modal.room} session={modal.session} products={products} customers={customers} now={now}
          onClose={()=>setModal(null)}
          onOk={async (method, customerId, cart, receivedAmount)=>{
            const ok = await callRpc("gc_end_session",{p_session_id:modal.session.id, p_method:method, p_cart:cart, p_received_amount:receivedAmount},
              "Seans yopildi");
            if(ok) setModal(null);
          }}/>
      )}
      {modal?.type==="addRoom" && <RoomFormModal onClose={()=>setModal(null)} onSave={async (f)=>{
        const {error} = await sb.from("rooms").insert({name:f.name, hourly_rate:f.day, day_price:f.day, night_price:f.night, sort_order:rooms.length});
        if(error) notify("Xato: "+error.message); else { notify("Xona qo'shildi"); setModal(null); refreshAll(); }
      }}/>}
      {modal?.type==="editRoom" && <RoomFormModal room={modal.room} onClose={()=>setModal(null)} onSave={async (f)=>{
        const {error} = await sb.from("rooms").update({name:f.name, hourly_rate:f.day, day_price:f.day, night_price:f.night}).eq("id",modal.room.id);
        if(error) notify("Xato: "+error.message); else { notify("Saqlandi"); setModal(null); refreshAll(); }
      }}/>}
      {modal?.type==="addProduct" && <ProductFormModal onClose={()=>setModal(null)} onSave={async (f)=>{
        const {error} = await sb.from("products").insert(f);
        if(error) notify("Xato: "+error.message); else { notify("Mahsulot qo'shildi"); setModal(null); refreshAll(); }
      }}/>}
      {modal?.type==="editProduct" && <ProductFormModal product={modal.product} onClose={()=>setModal(null)} onSave={async (f)=>{
        const {error} = await sb.from("products").update(f).eq("id",modal.product.id);
        if(error) notify("Xato: "+error.message); else { notify("Saqlandi"); setModal(null); refreshAll(); }
      }}/>}
      {modal?.type==="restock" && <RestockModal product={modal.product} onClose={()=>setModal(null)} onSave={async (qty, cost)=>{
        const {error} = await sb.rpc("gc_restock", {p_product_id:modal.product.id, p_qty:qty, p_cost:cost});
        if(error) notify("Xato: "+error.message); else { notify("Omborga qo'shildi"); setModal(null); refreshAll(); }
      }}/>}
      {modal?.type==="addCustomer" && <CustomerFormModal onClose={()=>setModal(null)} onSave={async (f)=>{
        const {error} = await sb.from("customers").insert(f);
        if(error) notify("Xato: "+error.message); else { notify("Mijoz qo'shildi"); setModal(null); refreshAll(); }
      }}/>}
      {modal?.type==="topup" && <TopupModal customer={modal.customer} onClose={()=>setModal(null)} onSave={async (amount, method)=>{
        const ok = await callRpc("gc_customer_topup",{p_customer_id:modal.customer.id, p_amount:amount, p_method:method});
        if(ok) setModal(null);
      }}/>}
      {modal?.type==="customerDebt" && <CustomerDebtModal customer={modal.customer} onClose={()=>setModal(null)} onSave={async (amount, note)=>{
        const ok = await callRpc("gc_customer_debt_add",{p_customer_id:modal.customer.id, p_amount:amount, p_note:note}, "Qarz yozildi");
        if(ok) setModal(null);
      }}/>}
      {modal?.type==="customerDebtPay" && <DebtPayModal title={modal.debt.customerName} remaining={modal.debt.remaining} onClose={()=>setModal(null)} onSave={async (amount)=>{
        const ok = await callRpc("gc_customer_debt_pay",{p_debt_id:modal.debt.id, p_amount:amount}, "To'lov qabul qilindi");
        if(ok) setModal(null);
      }}/>}
      {modal?.type==="addSupplier" && <SupplierFormModal onClose={()=>setModal(null)} onSave={async (f)=>{
        const ok = await callRpc("gc_supplier_add",{p_name:f.name, p_phone:f.phone, p_note:f.note}, "Ta'minotchi qo'shildi");
        if(ok) setModal(null);
      }}/>}
      {modal?.type==="supplierTx" && <SupplierTxModal supplier={modal.supplier} onClose={()=>setModal(null)} onSave={async (f)=>{
        const ok = await callRpc("gc_supplier_add_transaction",{p_supplier_id:modal.supplier.id, p_total_amount:f.total, p_paid_amount:f.paid, p_category:f.category, p_description:f.description}, "Yozuv qo'shildi");
        if(ok) setModal(null);
      }}/>}
      {modal?.type==="supplierPay" && <DebtPayModal title={modal.supplier.name} remaining={modal.supplier.debt} onClose={()=>setModal(null)} onSave={async (amount, note)=>{
        const ok = await callRpc("gc_supplier_pay",{p_supplier_id:modal.supplier.id, p_amount:amount, p_note:note||""}, "To'lov qayd etildi");
        if(ok) setModal(null);
      }} withNote/>}
      {modal?.type==="addItem" && (
        <AddItemModal room={modal.room} session={openSessionOf(modal.room.id)} products={products}
          onClose={()=>setModal(null)}
          onAdd={async (productId, qty)=>{ await callRpc("gc_session_add_item",{p_session_id:modal.session.id, p_product_id:productId, p_qty:qty}); }}
          onRemove={async (productId, qty)=>{ await callRpc("gc_session_remove_item",{p_session_id:modal.session.id, p_product_id:productId, p_qty:qty}); }}
        />
      )}
      {modal?.type==="yukQabul" && (
        <YukQabulModal products={products} suppliers={suppliers}
          onClose={()=>setModal(null)}
          onSave={async (payload)=>{
            const ok = await callRpc("gc_supplier_yuk_qabul", {
              p_supplier_id: payload.supplierId,
              p_items: payload.items,
              p_total_amount: payload.total,
              p_paid_amount: payload.paid,
              p_description: payload.description || ""
            }, "Yuk qabul qilindi");
            if(ok) setModal(null);
          }}/>
      )}
      {modal?.type==="expense" && <ExpenseModal onClose={()=>setModal(null)} onSave={async (f)=>{
        const ok = await callRpc("gc_add_expense",{p_title:f.title, p_amount:f.amount, p_category:f.category});
        if(ok) setModal(null);
      }}/>}
    </div>
  );
}

/* ================= BOSHQARUV (DASHBOARD) ================= */
function Kpi({label, value, accent, sub}){
  return (
    <div className="card kpi">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value num" style={accent?{color:accent}:null}>{value}</div>
      {sub && <div className="kpi-sub muted">{sub}</div>}
    </div>
  );
}

function DashboardView({rooms, sessions, products, cash, sales, expenses, now, onGoRooms, onGoStock}){
  const today = new Date().toDateString();
  const todayCash = cash.filter(c=>new Date(c.created_at).toDateString()===today);
  const incomeToday = todayCash.filter(c=>c.direction==="in").reduce((a,c)=>a+Number(c.amount),0);
  const outToday = todayCash.filter(c=>c.direction==="out").reduce((a,c)=>a+Number(c.amount),0);
  const expensesToday = expenses.filter(e=> new Date(e.created_at||e.date).toDateString()===today).reduce((a,e)=>a+Number(e.amount),0);
  const netToday = incomeToday - outToday - expensesToday;
  const busyRooms = rooms.filter(r=>r.status==="busy");
  const lowStock = products.filter(p=>Number(p.stock_qty)<=Number(p.min_stock));
  const salesToday = sales.filter(s=>new Date(s.created_at).toDateString()===today);

  const overtimeRooms = busyRooms.filter(r=>{
    const s = sessions.find(x=>x.room_id===r.id);
    return s && s.ends_at && (new Date(s.ends_at).getTime() - now) <= 0;
  });

  return (
    <div>
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))", marginBottom:22}}>
        <Kpi label="Bugungi tushum" value={money(incomeToday)} accent="var(--green)" />
        <Kpi label="Bugungi chiqim" value={money(outToday+expensesToday)} accent="var(--red)" />
        <Kpi label="Sof natija" value={money(netToday)} accent={netToday>=0?"var(--teal)":"var(--red)"} />
        <Kpi label="Faol xonalar" value={busyRooms.length+" / "+rooms.length} />
        <Kpi label="Bugungi sotuvlar" value={salesToday.length+" ta"} />
      </div>

      {overtimeRooms.length>0 && (
        <div className="card" style={{marginBottom:22, borderColor:"var(--red)", background:"var(--red-bg)"}}>
          <div style={{display:"flex", alignItems:"center", gap:10, fontWeight:700, color:"var(--red)"}}>
            ⏰ {overtimeRooms.length} ta xonada vaqt tugagan
          </div>
          <div className="muted" style={{marginTop:6}}>{overtimeRooms.map(r=>r.name).join(", ")} — diqqat talab qiladi.</div>
          <button className="btn small mt" onClick={onGoRooms}>Xonalarga o'tish →</button>
        </div>
      )}

      <div className="grid" style={{gridTemplateColumns:"1.3fr 1fr", gap:16}}>
        <div className="card">
          <h3 className="section-title">Xonalar holati</h3>
          <div style={{display:"flex", flexDirection:"column", gap:0}}>
            {rooms.map(r=>{
              const s = sessions.find(x=>x.room_id===r.id);
              const busy = r.status==="busy" && s;
              const remainMin = (busy && s?.ends_at) ? Math.ceil((new Date(s.ends_at).getTime() - now)/60000) : null;
              const overTime = remainMin!=null && remainMin<=0;
              return (
                <div key={r.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"9px 0", borderBottom:"1px solid var(--line)"}}>
                  <span>{r.name}</span>
                  {busy
                    ? <span className={"status busy"} style={overTime?{background:"var(--red)", color:"#fff"}:null}>{overTime?"Vaqt tugadi":"Band"}</span>
                    : <span className="status free">Bo'sh</span>}
                </div>
              );
            })}
          </div>
          <button className="btn small mt" onClick={onGoRooms}>Barcha xonalarni ko'rish →</button>
        </div>

        <div className="card">
          <h3 className="section-title">Ombor ogohlantirishi</h3>
          {lowStock.length===0 && <div className="muted">Kam qoldiqdagi mahsulot yo'q — hammasi yetarli.</div>}
          {lowStock.slice(0,6).map(p=>(
            <div key={p.id} style={{display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid var(--line)"}}>
              <span>{p.name}</span>
              <span className="num" style={{color:"var(--amber)", fontWeight:700}}>{p.stock_qty} qoldi</span>
            </div>
          ))}
          {lowStock.length>0 && <button className="btn small mt" onClick={onGoStock}>Omborni to'ldirish →</button>}
        </div>
      </div>
    </div>
  );
}

/* ================= XONALAR ================= */
const ROOM_STATUS = {free:"Bo'sh", busy:"Band", reserved:"Band qilingan", maintenance:"Ta'mir"};

/* Vaqt tugaganda bir marotaba signal beradi: ovozli bip + toast.
   Web Audio API orqali — tashqi audio fayl kerak emas. */
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 220, 440].forEach(delay=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.stop(ctx.currentTime + 0.2);
      }, delay);
    });
  }catch(e){ /* audio yo'q brauzerda — jim o'tkazamiz */ }
}

function RoomsView({rooms, sessions, products, customers, now, canOperate, isAdmin, notify, onStart, onEnd, onAddRoom, onEditRoom, onAddItem}){
  const warnedRef = useRef({});
  useEffect(()=>{
    rooms.forEach(room=>{
      const s = sessions.find(x=>x.room_id===room.id);
      if(!(room.status==="busy" && s && s.ends_at)) { delete warnedRef.current[room.id]; return; }
      const remainMin = Math.ceil((new Date(s.ends_at).getTime() - now)/60000);
      if(remainMin <= 0 && !warnedRef.current[room.id]){
        warnedRef.current[room.id] = true;
        if(notify) notify("⏰ "+room.name+" — vaqti tugadi!");
        playBeep();
        if(typeof Notification !== "undefined" && Notification.permission === "granted"){
          try{ new Notification("5Game Club", {body: room.name+" vaqti tugadi"}); }catch(e){}
        }
      }
      if(remainMin > 0 && warnedRef.current[room.id]) delete warnedRef.current[room.id];
    });
  }, [now, rooms, sessions]);

  useEffect(()=>{
    if(typeof Notification !== "undefined" && Notification.permission === "default"){
      Notification.requestPermission().catch(()=>{});
    }
  }, []);

  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        {canOperate && <button className="btn primary" onClick={onAddRoom}>+ Xona qo'shish</button>}

          const busy = room.status==="busy" && s;
          const mins = busy ? Math.max(1, Math.ceil((now - new Date(s.started_at).getTime())/60000)) : 0;
          const cost = busy ? roundMoney(s.tariff_per_hour * mins/60) : 0;
          const cartCount = (s?.cart||[]).reduce((a,c)=>a+Number(c.qty||0),0);
          const remainMin = (busy && s?.ends_at) ? Math.ceil((new Date(s.ends_at).getTime() - now)/60000) : null;
          const overTime = remainMin!=null && remainMin<=0;
          const totalPlannedMin = (busy && s?.started_at && s?.ends_at) ? Math.max(1, Math.round((new Date(s.ends_at).getTime() - new Date(s.started_at).getTime())/60000)) : null;
          const progressPct = (busy && totalPlannedMin) ? Math.min(100, Math.max(0, (mins/totalPlannedMin)*100)) : null;
          return (
            <div key={room.id} className={"card room"+(overTime?" room-overtime":"")}>

                      : `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`}
                  </div>
                  <div className="room-price num">{money(s.tariff_per_hour)} / soat{s.prepaid_amount?` · oldindan ${money(s.prepaid_amount)}`:""}</div>
                  {progressPct!=null && (
                    <div className="room-progress"><div className={"room-progress-fill"+(overTime?" over":"")} style={{width:progressPct+"%"}}></div></div>
                  )}
                  <div className="room-cost num">
                    {s.prepaid_amount ? <span className="muted" style={{fontSize:11, fontWeight:400}}>hozirgacha: </span> : null}
                    {money(cost)}{cartCount>0 && <span className="muted"> + {cartCount} ta mahsulot</span>}

                </div>
              ) : (
                <div className="muted" style={{margin:"14px 0"}}>

        {!rooms.length && <div className="card muted">Hozircha xona yo'q. "+ Xona qo'shish" tugmasini bosing.</div>}

    </div>
  );

function EndModal({room, session, products, customers, now, onClose, onOk}){
  const [method, setMethod] = useState("cash");
  const [customerId, setCustomerId] = useState(session.customer_id||"");
  const [cart, setCart] = useState([]);
  const [receivedInput, setReceivedInput] = useState("");
  const mins = Math.max(1, Math.ceil((now - new Date(session.started_at).getTime())/60000));
  const timeAmount = roundMoney(session.tariff_per_hour * mins/60);
  const prepaid = Number(session.prepaid_amount||0);
  const dueTime = Math.max(0, timeAmount - prepaid);
  const alreadyCart = session.cart || [];
  const alreadyTotal = alreadyCart.reduce((a,c)=>{ const p=products.find(x=>x.id===c.product_id); return a+(p?p.price*c.qty:0); },0);
  const newCartTotal = cart.reduce((a,c)=>{ const p=products.find(x=>x.id===c.product_id); return a+(p?p.price*c.qty:0); },0);
  const cartTotal = alreadyTotal + newCartTotal;
  const total = dueTime + cartTotal;
  const receivedNum = receivedInput===""? total : Number(receivedInput)||0;
  const extra = receivedNum - total;

  function addToCart(p){
    setCart(prev=>{
      const ex = prev.find(c=>c.product_id===p.id);
      if(ex) return prev.map(c=>c.product_id===p.id?{...c,qty:c.qty+1}:c);
      return [...prev,{product_id:p.id, qty:1}];
    });
  }
  const setQty = (id,d)=>setCart(prev=>prev.map(c=>c.product_id===id?{...c,qty:Math.max(0,c.qty+d)}:c).filter(c=>c.qty>0));
  const cust = customers.find(c=>c.id===customerId);

  return (
    <Modal title={room.name + " — seansni yakunlash"} onClose={onClose} width={560}>

        </div>
        <div className="card" style={{padding:12}}>
          <div className="kpi-label">{prepaid>0 ? "Hozir to'lash kerak" : "Summa"}</div>
          <div className="num" style={{fontSize:20,fontWeight:700,color:"var(--teal)"}}>{money(total)}</div>
          <div className="muted num">
            vaqt {money(timeAmount)}{prepaid>0 && ` (oldindan ${money(prepaid)} to'langan)`}{cartTotal>0 && " + savat "+money(cartTotal)}
          </div>
        </div>
      </div>

      {alreadyCart.length>0 && (
        <div className="field"><label>Seans davomida qo'shilgan mahsulotlar</label>
          <div className="mt">
            {alreadyCart.map(c=>{ const p=products.find(x=>x.id===c.product_id); if(!p) return null;
              return (
                <div key={c.product_id} className="cart-line">
                  <span style={{flex:1}}>{p.name}</span>
                  <span className="num">{c.qty} ta</span>
                  <span className="num" style={{width:90,textAlign:"right"}}>{money(p.price*c.qty)}</span>
                </div>
              );})}
          </div>
        </div>
      )}

      {method!=="balance" && (
        <div className="field"><label>Kassaga qabul qilingan summa</label>
          <input className="input num" type="number" placeholder={String(Math.round(total))} value={receivedInput} onChange={e=>setReceivedInput(e.target.value)}/>
          {extra>0 && <div className="muted" style={{marginTop:6,color:"var(--teal)"}}>+{money(extra)} ortiqcha — qo'shimcha daromad sifatida yoziladi</div>}
          {extra<0 && <div className="err mt">Kam tushdi: {money(-extra)}</div>}
        </div>
      )}

      <div className="field"><label>To'lov usuli</label>
        <div className="seg">
          {[["cash","Naqd"],["card","Karta"],["balance","Balans"]].map(([v,l])=>(
            <button key={v} type="button" className={method===v?"on":""} onClick={()=>setMethod(v)}>{l}</button>
          ))}
        </div>
      </div>
      {method==="balance" && (
        <div className="field"><label>Mijoz</label>
          <select className="input" value={customerId} onChange={e=>setCustomerId(e.target.value)}>
            <option value="">— tanlang —</option>
            {customers.filter(c=>c.is_active).map(c=><option key={c.id} value={c.id}>{c.name} (balans: {money(c.balance)})</option>)}
          </select>
          {cust && Number(cust.balance) < total && <div className="err mt">Balans yetarli emas!</div>}
        </div>
      )}

      <div className="field"><label>Savatga mahsulot qo'shish (ixtiyoriy)</label>
        <div className="grid pos-grid">
          {products.filter(p=>p.active).map(p=>(
            <button key={p.id} className="prod" onClick={()=>addToCart(p)}>
              <div className="nm">{p.name}</div>
              <div className="pr num">{money(p.price)}</div>
              <div className="st">qoldiq: {fmt(p.stock_qty)}</div>
            </button>
          ))}
        </div>
        {cart.length>0 && (
          <div className="mt">
            {cart.map(c=>{ const p=products.find(x=>x.id===c.product_id); if(!p) return null;
              return (
                <div key={c.product_id} className="cart-line">
                  <span style={{flex:1}}>{p.name}</span>
                  <button className="qty-btn" onClick={()=>setQty(c.product_id,-1)}>−</button>
                  <span className="num">{c.qty}</span>
                  <button className="qty-btn" onClick={()=>setQty(c.product_id,1)}>+</button>
                  <span className="num" style={{width:90,textAlign:"right"}}>{money(p.price*c.qty)}</span>

      </div>
    </Modal>
  );
}

              const p = products.find(x=>x.id===e.target.value);

            {i===0 && <label>Tannarx</label>}

        </div>

/* ================= TA'MINOTCHILAR ================= */
function supplierDebt(supplierId, supplierTx, supplierPayments){
  const totalDelivered = supplierTx.filter(t=>t.supplier_id===supplierId).reduce((a,t)=>a+Number(t.total_amount),0);
  const paidAtDelivery = supplierTx.filter(t=>t.supplier_id===supplierId).reduce((a,t)=>a+Number(t.paid_amount),0);
  const paidLater = supplierPayments.filter(p=>p.supplier_id===supplierId).reduce((a,p)=>a+Number(p.amount),0);
  return {totalDelivered, paid: paidAtDelivery+paidLater, debt: Math.max(0, totalDelivered - paidAtDelivery - paidLater)};
}

  const [dir, setDir] = useState("in");

  const [note, setNote] = useState("");
  const fileRef = useRef(null);

  function exportJson(){
    const blob = new Blob([JSON.stringify(cash, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

/* ================= HISOBOT ================= */
function ReportsView({cash, sales, sessions, expenses, products, isAdmin, backupData, onClearTransactions, onClearAll, onRestoreSuppliers}){
  const today = new Date().toDateString();
  const tIn = cash.filter(c=>c.direction==="in" && new Date(c.created_at).toDateString()===today);
  const byCat = {};
  tIn.forEach(c=>{ byCat[c.category||c.txn_type]=(byCat[c.category||c.txn_type]||0)+Number(c.amount); });
  const profit = sales.reduce((a,s)=>a+(s.sale_items||[]).reduce((x,it)=>{
    const p=products.find(pp=>pp.id===it.product_id);
    return x + (p ? (Number(it.unit_price)-Number(p.cost))*Number(it.qty) : 0);
  },0),0);
  const openSessions = sessions.length;
  const low = products.filter(p=>Number(p.stock_qty)<=Number(p.min_stock));
  return (
    <div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))"}}>
      <div className="card">
        <h3 className="section-title">Bugungi kirim (kategoriya)</h3>
        {Object.entries(byCat).map(([k,v])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
            <span className="muted">{k}</span><span className="num" style={{fontWeight:700}}>{money(v)}</span>
          </div>
        ))}
        {!Object.keys(byCat).length && <div className="muted">Bugun hali kirim yo'q</div>}
      </div>
      <div className="card">
        <h3 className="section-title">Ko'rsatkichlar</h3>
        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
          <span className="muted">Ochiq seanslar</span><span className="num" style={{fontWeight:700}}>{openSessions}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
          <span className="muted">Mahsulot savdosi (jami)</span><span className="num" style={{fontWeight:700}}>{sales.length} ta</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
          <span className="muted">Taxminiy sof foyda (sotuvdan)</span><span className="num" style={{fontWeight:700,color:"var(--green)"}}>{money(profit)}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0"}}>
          <span className="muted">Kam qoldiqdagi mahsulotlar</span><span className="num" style={{fontWeight:700,color:low.length?"var(--red)":"inherit"}}>{low.length} ta</span>
        </div>
      </div>
    </div>
    {isAdmin && <BackupControls backupData={backupData} onClearTransactions={onClearTransactions} onClearAll={onClearAll} onRestoreSuppliers={onRestoreSuppliers} />}
    </div>
  );
}

function BackupControls({backupData, onClearTransactions, onClearAll, onRestoreSuppliers}){
  const [busy, setBusy] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const [showDanger, setShowDanger] = useState(false);
  const [resetStock, setResetStock] = useState(false);
  const [confirmAll, setConfirmAll] = useState("");
  const [showClearAll, setShowClearAll] = useState(false);
  const restoreRef = useRef(null);

  function exportAll(){
    const payload = {exported_at: new Date().toISOString(), ...backupData};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "gameclub-toliq-zaxira-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  async function restoreFile(file){
    setBusy(true);
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      await onRestoreSuppliers(data);
    }catch(e){ alert("Fayl xato: "+e.message); }
    setBusy(false);
  }

  return (
    <div className="card" style={{marginTop:20}}>
      <h3 className="section-title">Zaxira nusxa (Backup)</h3>
      <p className="muted" style={{marginBottom:12}}>
        To'liq eksport — barcha xonalar, mahsulotlar, mijozlar, sotuvlar, kassa, xarajatlar, ta'minotchilar
        va qarzlar bitta JSON faylga tushadi (arxiv/hisobot uchun). Tiklash faqat <b>ta'minotchilar va qarzlar</b>
        ma'lumotini qayta yozadi — chunki boshqa jadvallar (mahsulot, mijoz, kassa) ni to'liq va xavfsiz tiklash uchun
        Supabase loyihangizdagi rasmiy "Backups" (Point-in-time recovery) funksiyasidan foydalanish tavsiya etiladi.
      </p>
      <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
        <button className="btn small" onClick={exportAll}>⬇ To'liq JSON eksport</button>
        <button className="btn small" disabled={busy} onClick={()=>restoreRef.current?.click()}>⬆ Ta'minotchi/qarz JSON'ni tiklash</button>
        <input ref={restoreRef} type="file" accept="application/json" style={{display:"none"}}
          onChange={e=>{ const f=e.target.files?.[0]; if(f) restoreFile(f); e.target.value=""; }}/>
      </div>

      <div style={{marginTop:22, paddingTop:16, borderTop:"1px solid var(--line)"}}>
        <h4 style={{color:"var(--red)", marginBottom:6}}>Xavfli hudud</h4>
        <p className="muted" style={{marginBottom:10}}>
          Barcha tranzaksiya tarixini (kassa, sotuvlar, xarajatlar, ta'minotchi/qarz yozuvlari, yopilgan seanslar) butunlay
          o'chiradi — yangi davr (oy) boshlash uchun. Xonalar, mahsulotlar ro'yxati, mijozlar va xodimlar SAQLANIB QOLADI.
          Bu amalni ORQAGA QAYTARIB BO'LMAYDI.
        </p>
        {!showDanger ? (
          <button className="btn small danger" onClick={()=>setShowDanger(true)}>Barcha tarixni tozalash…</button>
        ) : (
          <div style={{background:"var(--red-bg)", border:"1px solid var(--red)", borderRadius:10, padding:12}}>
            <div style={{marginBottom:8}}>Tasdiqlash uchun quyiga <b>TOZALASH</b> deb yozing:</div>
            <input className="input" value={confirmText} onChange={e=>setConfirmText(e.target.value)} style={{marginBottom:10}}/>
            <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,fontSize:13,cursor:"pointer"}}>
              <input type="checkbox" checked={resetStock} onChange={e=>setResetStock(e.target.checked)}/>
              Ombor qoldig'ini ham nolga tushirish (stock_qty = 0)
            </label>
            <div style={{display:"flex", gap:10}}>
              <button className="btn danger" disabled={confirmText!=="TOZALASH"} onClick={async ()=>{ await onClearTransactions(resetStock); setShowDanger(false); setConfirmText(""); setResetStock(false); }}>Ha, butunlay tozalash</button>
              <button className="btn" onClick={()=>{ setShowDanger(false); setConfirmText(""); setResetStock(false); }}>Bekor qilish</button>
            </div>
          </div>
        )}
      </div>

      <div style={{marginTop:22, paddingTop:16, borderTop:"1px solid var(--line)"}}>
        <h4 style={{color:"var(--red)", marginBottom:6}}>Butunlay yangi boshlash</h4>
        <p className="muted" style={{marginBottom:10}}>
          Barcha ma'lumotni o'chiradi: mahsulotlar, mijozlar, ta'minotchilar, kassa, sotuvlar,
          xarajatlar, qarzlar, oylik to'lovlari, seanslar — HAMMASI. Faqat xonalar va xodimlar
          (profil) qoladi. Bu amalni ORQAGA QAYTARIB BO'LMAYDI. Avval zaxira nusxa oling.
        </p>
        {!showClearAll ? (
          <button className="btn small danger" onClick={()=>setShowClearAll(true)}>Barcha ma'lumotni o'chirish…</button>
        ) : (
          <div style={{background:"var(--red-bg)", border:"1px solid var(--red)", borderRadius:10, padding:12}}>
            <div style={{marginBottom:8}}>Tasdiqlash uchun quyiga <b>YANGI</b> deb yozing:</div>
            <input className="input" value={confirmAll} onChange={e=>setConfirmAll(e.target.value)} style={{marginBottom:10}}/>
            <div style={{display:"flex", gap:10}}>
              <button className="btn danger" disabled={confirmAll!=="YANGI"} onClick={async ()=>{ await onClearAll(); setShowClearAll(false); setConfirmAll(""); }}>Ha, hammasini o'chirish</button>
              <button className="btn" onClick={()=>{ setShowClearAll(false); setConfirmAll(""); }}>Bekor qilish</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= XODIMLAR ================= */
function monthsElapsed(startDateStr){
  if(!startDateStr) return 0;
  const start = new Date(startDateStr);
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  return Math.max(1, months+1);
}

function StaffRow({p, payments, onSaveSalary, onPay}){
  const [agreed, setAgreed] = useState(p.agreed_salary ?? "");
  const [startDate, setStartDate] = useState(p.salary_start_date ?? "");
  const [payAmt, setPayAmt] = useState("");
  const [payNote, setPayNote] = useState("");
  const dirty = String(agreed) !== String(p.agreed_salary ?? "") || String(startDate) !== String(p.salary_start_date ?? "");

  const months = monthsElapsed(startDate);
  const accrued = startDate ? (Number(agreed)||0) * months : 0;
  const paid = payments.filter(x=>x.user_id===p.id).reduce((a,x)=>a+Number(x.amount),0);
  const balance = accrued - paid;

  return (
    <tr>
      <td>{p.full_name}</td>
      <td className="muted">{p.role}</td>
      <td>
        <input className="input num" style={{width:110}} type="number" placeholder="kelishilgan oylik"
          value={agreed} onChange={e=>setAgreed(e.target.value)}/>
      </td>
      <td>
        <input className="input" style={{width:140}} type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}/>
      </td>
      <td className="num muted">{startDate ? months+" oy" : "—"}</td>
      <td className="num">{startDate ? money(accrued) : "—"}</td>
      <td className="num">{money(paid)}</td>
      <td className="num" style={{fontWeight:700, color: balance>0?"var(--red)":"var(--green)"}}>{startDate ? money(balance) : "—"}</td>
      <td style={{whiteSpace:"nowrap"}}>
        {dirty && <button className="btn small" onClick={()=>onSaveSalary(p.id, Number(agreed)||0, startDate||null)}>Saqlash</button>}{" "}
        <input className="input num" style={{width:90}} type="number" placeholder="summa" value={payAmt} onChange={e=>setPayAmt(e.target.value)}/>
        <input className="input" style={{width:110}} placeholder="izoh" value={payNote} onChange={e=>setPayNote(e.target.value)}/>
        <button className="btn small primary" disabled={!(Number(payAmt)>0)}
          onClick={()=>{ onPay(p.id, Number(payAmt), payNote); setPayAmt(""); setPayNote(""); }}>To'lov</button>
      </td>
    </tr>
  );
}

      <table>
        <thead><tr><th>Ism</th><th>Rol</th><th>Holat</th></tr></thead>

            <tr key={p.id}>

                  onChange={e=>callRpc("gc_set_user_role",{p_user_id:p.id, p_role:e.target.value}, "Rol yangilandi")}>

      <h3 className="section-title" style={{marginTop:24}}>Oylik ish haqi</h3>
      <p className="muted">Har bir xodim uchun kelishilgan oylik va hisob boshlanish sanasini kiriting. Tizim shu sanadan beri necha oy o'tganini hisoblab, kerakli summani (kelishilgan oylik × oy soni) ko'rsatadi. To'langan avanslar ayirilib, qoldiq avtomatik keyingi oyga o'tadi.</p>
      <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr>
            <th>Ism</th><th>Rol</th><th>Kelishilgan oylik</th><th>Hisob boshlangan sana</th>
            <th>O'tgan oy</th><th>Jami kerak</th><th>To'langan</th><th>Qoldiq</th><th>Avans berish</th>

                    <td>{pr?.full_name || "—"}</td>
                    <td className="num">{money(sp.amount)}</td>
                    <td className="muted">{sp.note}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </>
      )}
    </div>
  );
}

/* ================= ROOT ================= */
function Root(){
  const [session, setSession] = useState(undefined); // undefined = loading
  useEffect(()=>{
    const cfg = getCfg();
    if(!cfg){ setSession(null); return; }
    sb = supabase.createClient(cfg.url, cfg.key);
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e,s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined) return <div className="auth-wrap"><div className="muted">Yuklanmoqda...</div></div>;
  if(!session) return <AuthScreen onReady={setSession}/>;
  return <App session={session}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
