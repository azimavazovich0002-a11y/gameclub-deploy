
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Game Club v2 — Boshqaruv paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0A0D12; --bg-1:#10141C; --bg-2:#151B26; --bg-3:#1B2230;
  --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.14);
  --txt-0:#EDEFF3; --txt-1:#A6AEC0; --txt-2:#6C7488;
  --teal:#19D3B5; --teal-dim:#0F8A78; --violet:#8B7CFF;
  --amber:#F2B341; --red:#F2555A; --green:#3ECF8E;
  --teal-bg:rgba(25,211,181,0.10); --violet-bg:rgba(139,124,255,0.10);
  --amber-bg:rgba(242,179,65,0.10); --red-bg:rgba(242,85,90,0.10); --green-bg:rgba(62,207,142,0.10);
  --radius-s:8px; --radius-m:12px; --radius-l:18px;
  --font-ui:'Sora',system-ui,-apple-system,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-0);color:var(--txt-0);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
#root{min-height:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
 
/* shell */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--bg-1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:800;font-size:18px}
.brand-dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--teal),var(--violet))}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--txt-1);font-weight:500;font-size:14px;background:none;border:none;width:100%;text-align:left;margin-bottom:2px}
.nav-item:hover{background:var(--bg-2);color:var(--txt-0)}
.nav-item.active{background:var(--teal-bg);color:var(--teal)}
.nav-badge{margin-left:auto;font-size:11px;background:var(--bg-3);border-radius:20px;padding:2px 8px}
.nav-badge.warn{background:var(--amber-bg);color:var(--amber)}
.nav-icon{display:flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;color:var(--txt-2)}
.nav-icon svg{width:18px;height:18px}
.nav-item.active .nav-icon{color:var(--teal)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04211C;flex-shrink:0}
.kpi{padding:16px 18px}
.kpi-label{font-size:11.5px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:700}
.kpi-sub{font-size:11.5px;margin-top:4px}
.card:hover{border-color:var(--line-strong)}
.main{flex:1;padding:24px 28px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.topbar h1{font-size:20px;margin:0;font-weight:700}
.spacer{flex:1}
.pill{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);color:var(--txt-1)}
.pill.live{color:var(--green);border-color:rgba(62,207,142,0.4);background:var(--green-bg)}
.pill.off{color:var(--amber);border-color:rgba(242,179,65,0.4);background:var(--amber-bg)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg-1);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px}
 
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg-2);color:var(--txt-0);font-weight:600;font-size:14px}
.btn:hover{background:var(--bg-3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#04211C}
.btn.primary:hover{background:#22e2c3}
.btn.danger{background:var(--red-bg);border-color:rgba(242,85,90,0.5);color:var(--red)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:0.45;cursor:not-allowed}
 
/* cards */
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px;transition:border-color .15s ease}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi-accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-label{font-size:12px;color:var(--txt-2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700}
 
/* rooms */
.rooms-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.room{position:relative;overflow:hidden}
.room-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.room-name{font-weight:700;font-size:16px}
.status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.status.free{background:var(--green-bg);color:var(--green)}
.status.busy{background:var(--red-bg);color:var(--red)}
.status.reserved{background:var(--amber-bg);color:var(--amber)}
.status.maintenance{background:var(--violet-bg);color:var(--violet)}
.room-overtime{animation:roomPulse 1.4s ease-in-out infinite; border-color:var(--red)!important;}
@keyframes roomPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,85,90,0);} 50%{box-shadow:0 0 0 4px rgba(242,85,90,0.28);}}
.room-time{font-size:26px;font-weight:700}
.room-price{font-size:13px;color:var(--txt-2);margin-top:2px}
.room-cost{font-size:18px;font-weight:700;color:var(--teal);margin-top:10px}
.room-actions{display:flex;gap:8px;margin-top:14px}
.room-actions .btn{flex:1;justify-content:center}
.room-progress{height:5px;border-radius:4px;background:var(--bg-3);margin-top:10px;overflow:hidden}
.room-progress-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .4s linear}
.room-progress-fill.over{background:var(--red)}
 
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--txt-2);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.low{color:var(--red);font-weight:700}
 
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(4,6,10,0.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--bg-1);border:1px solid var(--line-strong);border-radius:var(--radius-l);padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:5px}
.input,select.input{width:100%;background:var(--bg-2);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;color:var(--txt-0);font-size:14px;outline:none}
.input:focus{border-color:var(--teal)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1;justify-content:center}
.err{background:var(--red-bg);color:var(--red);border:1px solid rgba(242,85,90,0.4);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(62,207,142,0.4);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
 
/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px}
.auth-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:6px}
.auth-sub{color:var(--txt-2);font-size:13px;margin-bottom:20px}
.seg{display:flex;background:var(--bg-2);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:none;background:none;color:var(--txt-1);padding:8px;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--bg-3);color:var(--txt-0)}
 
/* pos */
.pos{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px 14px 84px}}
.mobile-nav{display:none}
.mobile-logout{display:none}
@media(max-width:900px){
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg-1);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mobile-nav button{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--txt-2);font-size:10.5px;padding:6px 4px;border-radius:10px}
  .mobile-nav button.active{color:var(--teal);background:var(--teal-bg)}
  .mobile-nav .nav-icon{width:19px;height:19px}
  .mobile-nav .nav-icon svg{width:19px;height:19px}
  .mobile-logout{display:inline-flex}
}
.pos-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.prod{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;cursor:pointer;text-align:left;color:var(--txt-0)}
.prod:hover{border-color:var(--teal)}
.prod .nm{font-weight:600;font-size:13px;margin-bottom:6px}
.prod .pr{color:var(--teal);font-weight:700}
.prod .st{font-size:11px;color:var(--txt-2);margin-top:4px}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-strong);background:var(--bg-2);color:var(--txt-0);font-weight:700}
.section-title{font-size:15px;font-weight:700;margin:0 0 12px}
.muted{color:var(--txt-2);font-size:13px}
.mt{margin-top:16px}
</style>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo} = React;
 
/* ================= SOZLASH ================= */
const SUPABASE_URL = "";      // Project URL
const SUPABASE_ANON_KEY = ""; // anon public key
 
function getCfg(){
  try{ const s = JSON.parse(localStorage.getItem("gc2_cfg")||"null"); if(s&&s.url&&s.key) return s; }catch(e){}
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL, key:SUPABASE_ANON_KEY};
  return null;
}
function setCfg(c){ try{ c?localStorage.setItem("gc2_cfg",JSON.stringify(c)):localStorage.removeItem("gc2_cfg"); }catch(e){} }
 
const fmt = n => (Number(n)||0).toLocaleString("uz-UZ");
const money = n => fmt(Math.round(Number(n)||0)) + " so'm";
// Summasiz (o'lchovli) seanslarda narx doim 500 so'mgacha yaxlitlanadi (kassa bilan mos kelishi uchun)
const ROUND_STEP = 500;
const roundMoney = n => Math.ceil((Number(n)||0)/ROUND_STEP)*ROUND_STEP;
 
/* ================= SUPABASE CONTEXT ================= */
let sb = null;
 
async function sbFetchAll(table, select="*"){
  const out = []; let from = 0;
  while(true){
    const {data, error} = await sb.from(table).select(select).range(from, from+999);
    if(error) throw error;
    out.push(...(data||[]));
    if(!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
 
/* ================= AUTH ================= */
function AuthScreen({onReady}){
  const [cfg, setCfgState] = useState(getCfg());
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [name, setName] = useState("");
  const [url, setUrl] = useState(cfg?.url||"");
  const [key, setKey] = useState(cfg?.key||"");
  const [showSetup, setShowSetup] = useState(!cfg);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
 
  useEffect(()=>{ if(cfg){ sb = supabase.createClient(cfg.url, cfg.key);
    sb.auth.getSession().then(({data})=>{ if(data.session) onReady(data.session); });
  }},[]);
 
  async function submit(e){
    e.preventDefault(); setErr(""); setBusy(true);
    try{
      if(mode==="login"){
        const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
        if(error) throw error;
        onReady(data.session);
      }else{
        const {data, error} = await sb.auth.signUp({email, password:pass, options:{data:{full_name:name}}});
        if(error) throw error;
        if(!data.session) setErr("Ro'yxatdan o'tish yuborildi. Agar email tasdiqlash yoqilgan bo'lsa, pochtangizni tekshiring (Supabase Dashboard > Authentication > Settings > 'Confirm email' ni o'chirib qo'yishingiz mumkin).");
        else onReady(data.session);
      }
    }catch(e){ setErr(e.message); }
    setBusy(false);
  }
 
  function saveSetup(){
    if(!url || !key){ setErr("URL va kalitni to'ldiring"); return; }
    const c = {url:url.trim(), key:key.trim()};
    setCfg(c); setCfgState(c); setShowSetup(false); setErr("");
    window.location.reload();
  }
 
  return (
    <div className="auth-wrap">
      <div className="card auth-card">
        <div className="auth-logo"><span className="brand-dot"></span> Game Club <span className="pill">v2</span></div>
        <div className="auth-sub">Supabase Auth himoyasidagi boshqaruv paneli</div>
        {showSetup ? (
          <div>
            <h3 className="section-title">Supabase ulanish</h3>
            <div className="field"><label>Project URL</label><input className="input" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></div>
            <div className="field"><label>Anon public key</label><input className="input" value={key} onChange={e=>setKey(e.target.value)} placeholder="sb_publishable_..."/></div>
            {err && <div className="err">{err}</div>}
            <div className="modal-actions">
              <button className="btn primary" onClick={saveSetup}>Saqlash</button>
              {cfg && <button className="btn" onClick={()=>setShowSetup(false)}>Orqaga</button>}
            </div>
            <p className="muted mt">Kalit: Supabase Dashboard → Project Settings → API → anon/public. Eski <b>sb_anon_...</b> kalit ham ishlaydi.</p>
          </div>
        ) : (
          <form onSubmit={submit}>
            <div className="seg">
              <button type="button" className={mode==="login"?"on":""} onClick={()=>setMode("login")}>Kirish</button>
              <button type="button" className={mode==="signup"?"on":""} onClick={()=>setMode("signup")}>Ro'yxatdan o'tish</button>
            </div>
            {mode==="signup" && <div className="field"><label>Ism</label><input className="input" value={name} onChange={e=>setName(e.target.value)}/></div>}
            <div className="field"><label>Email</label><input className="input" type="email" required value={email} onChange={e=>setEmail(e.target.value)}/></div>
            <div className="field"><label>Parol</label><input className="input" type="password" required minLength={6} value={pass} onChange={e=>setPass(e.target.value)}/></div>
            {err && <div className="err">{err}</div>}
            <button className="btn primary" style={{width:"100%",justifyContent:"center"}} disabled={busy}>{busy?"...":(mode==="login"?"Kirish":"Ro'yxatdan o'tish")}</button>
            <p className="muted mt" style={{textAlign:"center"}}>
              <a style={{color:"var(--teal)",cursor:"pointer"}} onClick={()=>{setShowSetup(true);setErr("");}}>Supabase sozlamasi</a>
            </p>
          </form>
        )}
      </div>
    </div>
  );
}
 
/* ================= MODAL ================= */
function Modal({title, onClose, children, width}){
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" style={width?{maxWidth:width}:null} onClick={e=>e.stopPropagation()}>
        <h3>{title}</h3>
        {children}
      </div>
    </div>
  );
}
 
/* ================= ASOSIY ILLOVA ================= */
const NAV = [
  {id:"dashboard", label:"Boshqaruv"},
  {id:"rooms", label:"Xonalar"},
  {id:"pos", label:"Sotuv"},
  {id:"stock", label:"Ombor"},
  {id:"clients", label:"Mijozlar"},
  {id:"cash", label:"Kassa"},
  {id:"reports", label:"Hisobot"},
  {id:"staff", label:"Xodimlar", admin:true},
];
const NAV_ICONS = {
  dashboard: <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.6" stroke="currentColor" strokeWidth="1.5"/><rect x="11" y="2.5" width="6.5" height="4.2" rx="1.6" stroke="currentColor" strokeWidth="1.5"/><rect x="11" y="8.8" width="6.5" height="8.7" rx="1.6" stroke="currentColor" strokeWidth="1.5"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="1.6" stroke="currentColor" strokeWidth="1.5"/></svg>,
  rooms: <svg viewBox="0 0 20 20" fill="none"><path d="M3 8.5 10 3l7 5.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M4.5 7.5V16a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V7.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><rect x="8.2" y="11.5" width="3.6" height="5.5" stroke="currentColor" strokeWidth="1.5"/></svg>,
  pos: <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="10.5" rx="1.8" stroke="currentColor" strokeWidth="1.5"/><path d="M2.5 8.5h15" stroke="currentColor" strokeWidth="1.5"/><path d="M5.5 11.5h3M5.5 13.5h5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  stock: <svg viewBox="0 0 20 20" fill="none"><path d="M3 6.2 10 2.8l7 3.4-7 3.4-7-3.4Z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M3 6.2v7.6l7 3.4 7-3.4V6.2" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M10 9.6v7.6" stroke="currentColor" strokeWidth="1.5"/></svg>,
  clients: <svg viewBox="0 0 20 20" fill="none"><circle cx="7.2" cy="6.5" r="2.6" stroke="currentColor" strokeWidth="1.5"/><path d="M2.4 16c.5-3 2.4-4.6 4.8-4.6s4.3 1.6 4.8 4.6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><circle cx="14.2" cy="7.2" r="2.1" stroke="currentColor" strokeWidth="1.4"/><path d="M12.9 11.7c1.9-.4 3.6.7 4.1 3.4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  cash: <svg viewBox="0 0 20 20" fill="none"><rect x="2.3" y="5.5" width="15.4" height="9.5" rx="1.8" stroke="currentColor" strokeWidth="1.5"/><circle cx="10" cy="10.2" r="2.3" stroke="currentColor" strokeWidth="1.5"/><path d="M5 8v-.3c0-1 .8-1.8 1.8-1.8M15 12.5v.3c0 1-.8 1.8-1.8 1.8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,
  reports: <svg viewBox="0 0 20 20" fill="none"><path d="M4 16.5V9M9.3 16.5V4.5M14.6 16.5v-6.2" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/><path d="M2.5 16.5h15" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  staff: <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.3" r="3" stroke="currentColor" strokeWidth="1.5"/><path d="M3.5 17c.7-4 3-6 6.5-6s5.8 2 6.5 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
};
 
function App({session}){
  const [view, setView] = useState("dashboard");
  const [profile, setProfile] = useState(null);
  const [rooms, setRooms] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [products, setProducts] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [cash, setCash] = useState([]);
  const [sales, setSales] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [profiles, setProfiles] = useState([]);
  const [live, setLive] = useState(false);
  const [toast, setToast] = useState("");
  const [modal, setModal] = useState(null); // {type, ...}
  const [now, setNow] = useState(Date.now());
  const chRef = useRef(null);
 
  const isAdmin = profile?.role === "admin";
  const isStaff = ["admin","operator","cashier"].includes(profile?.role);
  const canOperate = ["admin","operator"].includes(profile?.role);
 
  function notify(msg){ setToast(msg); setTimeout(()=>setToast(""), 3000); }
 
  async function refreshAll(){
    try{
      const [r, s, p, c, ct, sl, ex] = await Promise.all([
        sbFetchAll("rooms"),
        sb.from("sessions").select("*").eq("status","open"),
        sbFetchAll("products"),
        sbFetchAll("customers"),

  const outToday = todayCash.filter(c=>c.direction==="out").reduce((a,c)=>a+Number(c.amount),0);
  const expensesToday = expenses.filter(e=> new Date(e.created_at||e.date).toDateString()===today).reduce((a,e)=>a+Number(e.amount),0);
  const netToday = incomeToday - outToday - expensesToday;
  const busyRooms = rooms.filter(r=>r.status==="busy");
  const lowStock = products.filter(p=>Number(p.stock_qty)<=Number(p.min_stock));
  const salesToday = sales.filter(s=>new Date(s.created_at).toDateString()===today);
 
  const overtimeRooms = busyRooms.filter(r=>{
    const s = sessions.find(x=>x.room_id===r.id);
    return s && s.ends_at && (new Date(s.ends_at).getTime() - now) <= 0;
  });
 
  return (
    <div>
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))", marginBottom:22}}>
        <Kpi label="Bugungi tushum" value={money(incomeToday)} accent="var(--green)" />
        <Kpi label="Bugungi chiqim" value={money(outToday+expensesToday)} accent="var(--red)" />
        <Kpi label="Sof natija" value={money(netToday)} accent={netToday>=0?"var(--teal)":"var(--red)"} />
        <Kpi label="Faol xonalar" value={busyRooms.length+" / "+rooms.length} />
        <Kpi label="Bugungi sotuvlar" value={salesToday.length+" ta"} />
      </div>
 
      {overtimeRooms.length>0 && (
        <div className="card" style={{marginBottom:22, borderColor:"var(--red)", background:"var(--red-bg)"}}>
          <div style={{display:"flex", alignItems:"center", gap:10, fontWeight:700, color:"var(--red)"}}>

          <button className="btn small mt" onClick={onGoRooms}>Xonalarga o'tish →</button>
        </div>
      )}
 
      <div className="grid" style={{gridTemplateColumns:"1.3fr 1fr", gap:16}}>

const ROOM_STATUS = {free:"Bo'sh", busy:"Band", reserved:"Band qilingan", maintenance:"Ta'mir"};
 
/* Vaqt tugaganda bir marotaba signal beradi: ovozli bip + toast.
   Web Audio API orqali — tashqi audio fayl kerak emas. */
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 220, 440].forEach(delay=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.stop(ctx.currentTime + 0.2);
      }, delay);
    });
  }catch(e){ /* audio yo'q brauzerda — jim o'tkazamiz */ }
}
 
function RoomsView({rooms, sessions, products, customers, now, canOperate, isAdmin, notify, onStart, onEnd, onAddRoom, onEditRoom}){
  const warnedRef = useRef({});
  useEffect(()=>{
    rooms.forEach(room=>{
      const s = sessions.find(x=>x.room_id===room.id);
      if(!(room.status==="busy" && s && s.ends_at)) { delete warnedRef.current[room.id]; return; }
      const remainMin = Math.ceil((new Date(s.ends_at).getTime() - now)/60000);
      if(remainMin <= 0 && !warnedRef.current[room.id]){
        warnedRef.current[room.id] = true;
        if(notify) notify("⏰ "+room.name+" — vaqti tugadi!");
        playBeep();
        if(typeof Notification !== "undefined" && Notification.permission === "granted"){
          try{ new Notification("5Game Club", {body: room.name+" vaqti tugadi"}); }catch(e){}
        }
      }
      if(remainMin > 0 && warnedRef.current[room.id]) delete warnedRef.current[room.id];
    });
  }, [now, rooms, sessions]);
 
  useEffect(()=>{
    if(typeof Notification !== "undefined" && Notification.permission === "default"){
      Notification.requestPermission().catch(()=>{});
    }
  }, []);
 
  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        {canOperate && <button className="btn primary" onClick={onAddRoom}>+ Xona qo'shish</button>}
      </div>
      <div className="grid rooms-grid">
        {rooms.map(room=>{
          const s = sessions.find(x=>x.room_id===room.id);
          const busy = room.status==="busy" && s;
          const mins = busy ? Math.max(1, Math.ceil((now - new Date(s.started_at).getTime())/60000)) : 0;
          const cost = busy ? roundMoney(s.tariff_per_hour * mins/60) : 0;
          const cartCount = (s?.cart||[]).reduce((a,c)=>a+Number(c.qty||0),0);
          const remainMin = (busy && s?.ends_at) ? Math.ceil((new Date(s.ends_at).getTime() - now)/60000) : null;
          const overTime = remainMin!=null && remainMin<=0;
          const totalPlannedMin = (busy && s?.started_at && s?.ends_at) ? Math.max(1, Math.round((new Date(s.ends_at).getTime() - new Date(s.started_at).getTime())/60000)) : null;
          const progressPct = (busy && totalPlannedMin) ? Math.min(100, Math.max(0, (mins/totalPlannedMin)*100)) : null;
          return (
            <div key={room.id} className={"card room"+(overTime?" room-overtime":"")}>
              <div className="room-top">
                <span className="room-name">{room.name}</span>
                <span className={"status "+room.status}>{ROOM_STATUS[room.status]||room.status}</span>
              </div>
              {busy ? (
                <div>
                  <div className="room-time num" style={overTime?{color:"var(--red)"}:{}}>
                    {remainMin!=null
                      ? (overTime ? "Vaqt tugadi!" : `${String(Math.floor(remainMin/60)).padStart(2,"0")}:${String(remainMin%60).padStart(2,"0")} qoldi`)
                      : `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`}
                  </div>
                  <div className="room-price num">{money(s.tariff_per_hour)} / soat{s.prepaid_amount?` · oldindan ${money(s.prepaid_amount)}`:""}</div>
                  {progressPct!=null && (
                    <div className="room-progress"><div className={"room-progress-fill"+(overTime?" over":"")} style={{width:progressPct+"%"}}></div></div>
                  )}
                  <div className="room-cost num">
                    {s.prepaid_amount ? <span className="muted" style={{fontSize:11, fontWeight:400}}>hozirgacha: </span> : null}
                    {money(cost)}{cartCount>0 && <span className="muted"> + {cartCount} ta mahsulot</span>}
                  </div>
                </div>
              ) : (
                <div className="muted" style={{margin:"14px 0"}}>
                  Kunduzi: <b className="num" style={{color:"var(--txt-0)"}}>{money(room.day_price)}</b><br/>
                  Tunda: <b className="num" style={{color:"var(--txt-0)"}}>{money(room.night_price)}</b>
                </div>
              )}
              <div className="room-actions">
                {canOperate && (busy
                  ? <button className="btn danger" onClick={()=>onEnd(room)}>Yakunlash</button>
                  : <button className="btn primary" onClick={()=>onStart(room)}>Boshlash</button>)}
                {isAdmin && <button className="btn small" onClick={()=>onEditRoom(room)}>✎</button>}
              </div>
            </div>
          );
        })}
        {!rooms.length && <div className="card muted">Hozircha xona yo'q. "+ Xona qo'shish" tugmasini bosing.</div>}
      </div>
    </div>
  );
}

function EndModal({room, session, products, customers, now, onClose, onOk}){
  const [method, setMethod] = useState("cash");
  const [customerId, setCustomerId] = useState(session.customer_id||"");
  const [cart, setCart] = useState([]);
  const mins = Math.max(1, Math.ceil((now - new Date(session.started_at).getTime())/60000));
  const timeAmount = roundMoney(session.tariff_per_hour * mins/60);
  const prepaid = Number(session.prepaid_amount||0);
  const dueTime = Math.max(0, timeAmount - prepaid);
  const cartTotal = cart.reduce((a,c)=>{ const p=products.find(x=>x.id===c.product_id); return a+(p?p.price*c.qty:0); },0);
  const total = dueTime + cartTotal;
 
  function addToCart(p){
    setCart(prev=>{
      const ex = prev.find(c=>c.product_id===p.id);
      if(ex) return prev.map(c=>c.product_id===p.id?{...c,qty:c.qty+1}:c);
      return [...prev,{product_id:p.id, qty:1}];
    });
  }
  const setQty = (id,d)=>setCart(prev=>prev.map(c=>c.product_id===id?{...c,qty:Math.max(0,c.qty+d)}:c).filter(c=>c.qty>0));

function PosView({products, customers, callRpc, notify}){
  const [cart, setCart] = useState([]);

  const [busy, setBusy] = useState(false);
  const total = cart.reduce((a,c)=>{ const p=products.find(x=>x.id===c.product_id); return a+(p?p.price*c.qty:0); },0);
  const cust = customers.find(c=>c.id===customerId);
 
  const add = (p)=>setCart(prev=>{ const ex=prev.find(c=>c.product_id===p.id);
    if(ex) return prev.map(c=>c.product_id===p.id?{...c,qty:c.qty+1}:c);
    return [...prev,{product_id:p.id, qty:1}]; });
  const setQty = (id,d)=>setCart(prev=>prev.map(c=>c.product_id===id?{...c,qty:Math.max(0,c.qty+d)}:c).filter(c=>c.qty>0));
 
  async function pay(){
    if(!cart.length) return;

    const ok = await callRpc("gc_make_sale",{p_items:cart, p_method:method, p_customer_id:customerId||null}, "Sotuv muvaffaqiyatli");

        <h3 className="section-title">Savat</h3>
        {!cart.length && <div className="muted">Mahsulot tanlang</div>}
        {cart.map(c=>{ const p=products.find(x=>x.id===c.product_id); if(!p) return null;
          return (
            <div key={c.product_id} className="cart-line">
              <span style={{flex:1}}>{p.name}</span>
              <button className="qty-btn" onClick={()=>setQty(c.product_id,-1)}>−</button>
              <span className="num">{c.qty}</span>
              <button className="qty-btn" onClick={()=>setQty(c.product_id,1)}>+</button>
              <span className="num" style={{width:90,textAlign:"right"}}>{money(p.price*c.qty)}</span>
            </div>
          );})}
        <div className="field mt"><label>To'lov usuli</label>
          <div className="seg">
            {[["cash","Naqd"],["card","Karta"],["balance","Balans"]].map(([v,l])=>(
              <button key={v} type="button" className={method===v?"on":""} onClick={()=>setMethod(v)}>{l}</button>
            ))}
          </div>
        </div>
        {method==="balance" && (
          <div className="field"><label>Mijoz</label>
            <select className="input" value={customerId} onChange={e=>setCustomerId(e.target.value)}>
              <option value="">— tanlang —</option>
              {customers.filter(c=>c.is_active).map(c=><option key={c.id} value={c.id}>{c.name} (balans: {money(c.balance)})</option>)}
            </select>
            {cust && Number(cust.balance) < total && <div className="err mt">Balans yetarli emas!</div>}
          </div>
        )}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:18,fontWeight:700,margin:"14px 0"}}>
          <span>Jami</span><span className="num" style={{color:"var(--teal)"}}>{money(total)}</span>

function Root(){
  const [session, setSession] = useState(undefined); // undefined = loading
  useEffect(()=>{
    const cfg = getCfg();
    if(!cfg){ setSession(null); return; }
    sb = supabase.createClient(cfg.url, cfg.key);
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e,s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined) return <div className="auth-wrap"><div className="muted">Yuklanmoqda...</div></div>;
  if(!session) return <AuthScreen onReady={setSession}/>;
  return <App session={session}/>;
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
